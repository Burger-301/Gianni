<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RG Soluções Técnicas</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007bff">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        .login-card img {
            max-width: 150px;
            height: auto;
            margin-bottom: 15px;
        }
        h2 { color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; color: #555; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; background: #007BFF; color: white; border: none; padding: 10px; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background: #0056b3; }
        #error-msg { color: red; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="login-card">
        <!-- Logótipo -->
        <img src="img/logo.png" alt="RG Soluções Técnicas">
        
        <h2>Iniciar Sessão</h2>
        <form id="login-form">
            <div class="form-group">
                <label>E-mail:</label>
                <input type="email" id="email" required placeholder="exemplo@email.com">
            </div>
            <div class="form-group">
                <label>Palavra-passe:</label>
                <input type="password" id="password" required placeholder="********">
            </div>
            <button type="submit" id="btn-login">Entrar</button>
            <div id="error-msg"></div>
        </form>

        <!-- Assinatura -->
        <div style="margin-top: 25px; font-size: 11px; color: #adb5bd; font-weight: 500;">
            Powered by CS Code Solutions
        </div>
    </div>

    <!-- Registo do Service Worker para PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(() => console.log("Service Worker registado com sucesso!"))
                    .catch((err) => console.log("Erro ao registar o Service Worker:", err));
            });
        }
    </script>

    <!-- Script com Cache Busting (v=1.3) -->
    <script type="module">
        import { auth } from './js/firebase-config.js?v=1.3';
        import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const loginForm = document.getElementById('login-form');
        const errorMsg = document.getElementById('error-msg');
        const btnLogin = document.getElementById('btn-login');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            errorMsg.textContent = "";
            btnLogin.disabled = true;
            btnLogin.textContent = "A entrar...";

            try {
                await signInWithEmailAndPassword(auth, email, password);
                window.location.href = 'index.html';
            } catch (error) {
                console.error("Erro no login:", error);
                let msg = "Erro ao entrar. Verifique o e-mail e a palavra-passe.";
                if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
                    msg = "E-mail ou palavra-passe incorretos.";
                } else if (error.code === 'auth/too-many-requests') {
                    msg = "Muitas tentativas falhadas. Tente novamente mais tarde.";
                }
                errorMsg.textContent = msg;
                btnLogin.disabled = false;
                btnLogin.textContent = "Entrar";
            }
        });
    </script>
</body>
</html>
