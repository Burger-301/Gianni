<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistência Técnica - RG Soluções Técnicas</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Menu Lateral (Sidebar) com o Logótipo -->
        <aside class="sidebar">
            <div style="text-align: center; margin-bottom: 20px; padding: 10px;">
                <img src="img/logo.png" alt="RG Soluções Técnicas" style="max-width: 100%; height: auto; border-radius: 4px;">
            </div>
            <nav>
                <a href="index.html" class="active">🏠 Início</a>
                <a href="clientes.html">👥 Gestão de Clientes</a>
                <a href="nova-os.html">📋 Nova Ordem de Serviço</a>
                <a href="historico.html">📜 Histórico</a>
                <a href="#" id="btn-logout" style="margin-top: 30px; background: #dc3545; text-align: center;">🚪 Terminar Sessão</a>
            </nav>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="main-content">
            <!-- Botão do menu para telemóveis (visível apenas em ecrãs pequenos) -->
            <button class="menu-toggle" id="menuToggle">☰ Menu</button>

            <div style="background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 600px; margin-top: 10px;">
                <h1 style="color: #333; font-size: 22px; margin-bottom: 10px;">Painel de Controlo Principal</h1>
                <p style="color: #666; margin-bottom: 20px;">Bem-vindo ao sistema da RG Soluções Técnicas. Utilize o menu lateral para navegar entre a gestão de clientes, abertura de novas ordens de serviço e consulta de histórico.</p>
            </div>
        </main>
    </div>

    <!-- Script de Autenticação, Proteção e Controlo do Menu Mobile -->
    <script type="module">
        import { auth } from './js/firebase-config.js';
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Verifica se o utilizador está autenticado
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = 'login.html';
            }
        });

        // Controlo do Menu Mobile (Abre/Fecha a sidebar lateral)
        const menuToggle = document.getElementById('menuToggle');
        const sidebar = document.querySelector('.sidebar');
        if (menuToggle) {
            menuToggle.addEventListener('click', () => {
                sidebar.classList.toggle('active');
            });
        }

        // Botão para Terminar Sessão
        document.getElementById('btn-logout').addEventListener('click', async (e) => {
            e.preventDefault();
            try {
                await signOut(auth);
                window.location.href = 'login.html';
            } catch (error) {
                console.error("Erro ao terminar sessão:", error);
            }
        });
    </script>
</body>
</html>
