<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Ordem de Serviço - RG Soluções Técnicas</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Signature Pad CDN -->
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Menu Lateral -->
        <aside class="sidebar">
            <div style="text-align: center; margin-bottom: 20px; padding: 10px;">
                <img src="img/logo.png" alt="RG Soluções Técnicas" style="max-width: 100%; height: auto; border-radius: 4px;">
            </div>
            <nav>
                <a href="historico.html">🏠 Início / Histórico</a>
                <a href="clientes.html">👥 Gestão de Clientes</a>
                <a href="nova-os.html" class="active">📋 Nova Ordem de Serviço</a>
                <a href="#" id="btn-logout" style="margin-top: 30px; background: #dc3545; text-align: center;">🚪 Terminar Sessão</a>
            </nav>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="main-content">
            <button class="menu-toggle" id="menuToggle">☰ Menu</button>

            <div class="container" style="max-width: 800px;">
                <a href="historico.html" class="voltar">⬅ Voltar ao Início</a>
                
                <h2>Nova Ordem de Serviço</h2>

                <form id="os-form" style="margin-top: 20px;">
                    <!-- Seleção de Cliente -->
                    <div style="margin-bottom: 15px;">
                        <label style="display: block; font-weight: bold; margin-bottom: 5px;">Cliente:</label>
                        <select id="client-select" required style="width: 100%; padding: 8px; box-sizing: border-box;">
                            <option value="">A carregar clientes...</option>
                        </select>
                    </div>

                    <!-- Dados do Equipamento -->
                    <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px;">
                        <div style="flex: 1; min-width: 200px;">
                            <label style="display: block; font-weight: bold; margin-bottom: 5px;">Equipamento:</label>
                            <input type="text" id="equipment" required style="width: 100%; padding: 8px; box-sizing: border-box;">
                        </div>
                        <div style="flex: 1; min-width: 200px;">
                            <label style="display: block; font-weight: bold; margin-bottom: 5px;">Marca:</label>
                            <input type="text" id="brand" style="width: 100%; padding: 8px; box-sizing: border-box;">
                        </div>
                    </div>

                    <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px;">
                        <div style="flex: 1; min-width: 200px;">
                            <label style="display: block; font-weight: bold; margin-bottom: 5px;">Modelo:</label>
                            <input type="text" id="model" style="width: 100%; padding: 8px; box-sizing: border-box;">
                        </div>
                        <div style="flex: 1; min-width: 200px;">
                            <label style="display: block; font-weight: bold; margin-bottom: 5px;">Matrícula / N° de Série:</label>
                            <input type="text" id="serial-number" style="width: 100%; padding: 8px; box-sizing: border-box;">
                        </div>
                    </div>

                    <!-- Tipo e Área de Serviço -->
                    <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px;">
                        <div style="flex: 1; min-width: 200px;">
                            <label style="display: block; font-weight: bold; margin-bottom: 5px;">Tipo de Manutenção:</label>
                            <select id="service-nature" style="width: 100%; padding: 8px; box-sizing: border-box;">
                                <option value="Corretiva">Corretiva</option>
                                <option value="Preventiva">Preventiva</option>
                                <option value="Garantia">Garantia</option>
                            </select>
                        </div>
                        <div style="flex: 1; min-width: 200px;">
                            <label style="display: block; font-weight: bold; margin-bottom: 5px;">Área de Serviço:</label>
                            <select id="service-area" required style="width: 100%; padding: 8px; box-sizing: border-box;">
                                <option value="Elétrica">Elétrica</option>
                                <option value="Mecânica">Mecânica</option>
                            </select>
                        </div>
                    </div>

                    <!-- Controle de Turnos e Horários -->
                    <div style="background: #f8f9fa; padding: 15px; border-radius: 6px; margin-bottom: 15px; border: 1px solid #ddd;">
                        <h3 style="font-size: 15px; margin-top: 0; color: #2c3e50; margin-bottom: 10px;">Controle de Turnos e Horários</h3>
                        
                        <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px;">
                            <div style="flex: 1; min-width: 200px;">
                                <label style="display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px;">Início Manhã:</label>
                                <input type="datetime-local" id="time-start-manha" style="width: 100%; padding: 8px; box-sizing: border-box;">
                            </div>
                            <div style="flex: 1; min-width: 200px;">
                                <label style="display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px;">Final Manhã:</label>
                                <input type="datetime-local" id="time-end-manha" style="width: 100%; padding: 8px; box-sizing: border-box;">
                            </div>
                        </div>

                        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                            <div style="flex: 1; min-width: 200px;">
                                <label style="display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px;">Início Tarde:</label>
                                <input type="datetime-local" id="time-start-tarde" style="width: 100%; padding: 8px; box-sizing: border-box;">
                            </div>
                            <div style="flex: 1; min-width: 200px;">
                                <label style="display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px;">Final Tarde (Encerramento da O.S.):</label>
                                <input type="datetime-local" id="time-end-tarde" style="width: 100%; padding: 8px; box-sizing: border-box;">
                            </div>
                        </div>
                    </div>

                    <!-- Técnico Responsável -->
                    <div style="margin-bottom: 15px;">
                        <label style="display: block; font-weight: bold; margin-bottom: 5px;">Técnico Responsável:</label>
                        <input type="text" id="technician-name" required style="width: 100%; padding: 8px; box-sizing: border-box;">
                    </div>

                    <!-- Descrição -->
                    <div style="margin-bottom: 15px;">
                        <label style="display: block; font-weight: bold; margin-bottom: 5px;">Descrição do Serviço:</label>
                        <textarea id="description" rows="4" style="width: 100%; padding: 8px; box-sizing: border-box;"></textarea>
                    </div>

                    <!-- Anexo / Fotografia -->
                    <div style="margin-bottom: 15px;">
                        <label style="display: block; font-weight: bold; margin-bottom: 5px;">Fotografia / Anexo do Equipamento:</label>
                        <input type="file" id="os-image" accept="image/*" style="width: 100%; padding: 8px; box-sizing: border-box; background: #fff; border: 1px solid #ccc; border-radius: 4px;">
                    </div>

                    <!-- Condição de Pagamento -->
                    <div style="margin-bottom: 15px;">
                        <label style="display: block; font-weight: bold; margin-bottom: 5px;">Condição de Pagamento (Dias):</label>
                        <input type="text" id="payment-terms" placeholder="Ex: 30" required style="width: 100%; padding: 8px; box-sizing: border-box;">
                    </div>

                    <!-- Assinaturas -->
                    <div style="margin-top: 20px;">
                        <h4 style="margin-bottom: 5px;">Assinatura do Técnico Responsável</h4>
                        <canvas id="tech-pad" style="border: 1px solid #ccc; width: 100%; height: 150px; background: #fff; touch-action: none; border-radius: 4px;"></canvas>
                        <button type="button" id="clear-tech" style="margin-top: 5px; padding: 5px 10px; background: #6c757d; color: white; border: none; border-radius: 4px; cursor: pointer;">Limpar Assinatura</button>
                    </div>

                    <div style="margin-top: 20px;">
                        <h4 style="margin-bottom: 5px;">Assinatura do Cliente</h4>
                        <canvas id="client-pad" style="border: 1px solid #ccc; width: 100%; height: 150px; background: #fff; touch-action: none; border-radius: 4px;"></canvas>
                        <button type="button" id="clear-client" style="margin-top: 5px; padding: 5px 10px; background: #6c757d; color: white; border: none; border-radius: 4px; cursor: pointer;">Limpar Assinatura</button>
                    </div>

                    <div style="margin-top: 30px;">
                        <button type="submit" style="width: 100%; padding: 12px; background: #28a745; color: white; font-size: 16px; font-weight: bold; border: none; border-radius: 4px; cursor: pointer;">Guardar Ordem de Serviço</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script type="module">
        import { auth } from './js/firebase-config.js';
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        onAuthStateChanged(auth, (user) => {
            if (!user) window.location.href = 'login.html';
        });

        const menuToggle = document.getElementById('menuToggle');
        const sidebar = document.querySelector('.sidebar');
        if (menuToggle && sidebar) {
            menuToggle.addEventListener('click', (e) => {
                e.stopPropagation();
                sidebar.classList.toggle('active');
            });

            document.addEventListener('click', (event) => {
                if (sidebar.classList.contains('active')) {
                    if (!sidebar.contains(event.target) && !menuToggle.contains(event.target)) {
                        sidebar.classList.remove('active');
                    }
                }
            });
        }

        const btnLogout = document.getElementById('btn-logout');
        if (btnLogout) {
            btnLogout.addEventListener('click', async (e) => {
                e.preventDefault();
                await signOut(auth);
                window.location.href = 'login.html';
            });
        }
    </script>

    <script type="module" src="js/os.js"></script>
</body>
</html>
