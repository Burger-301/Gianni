<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Ordem de Serviço - RG Soluções Técnicas</title>
    <link rel="stylesheet" href="css/style.css?v=1.5">
    <!-- Signature Pad CDN -->
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Menu Lateral -->
        <aside class="sidebar">
            <div style="text-align: center; margin-bottom: 20px; padding: 10px;">
                <img src="img/logo.png" alt="RG Soluções Técnicas" style="max-width: 100%; height: auto; border-radius: 4px;">
            </div>
            <nav>
                <a href="index.html">🏠 Início / Histórico</a>
                <a href="clientes.html">👥 Gestão de Clientes</a>
                <a href="nova-os.html" class="active">📋 Nova Ordem de Serviço</a>
                <a href="#" id="btn-logout" style="margin-top: 30px; background: #dc3545; text-align: center;">🚪 Terminar Sessão</a>
            </nav>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="main-content">
            <button class="menu-toggle" id="menuToggle">☰ Menu</button>

            <div class="container" style="max-width: 800px;">
                <a href="index.html" class="voltar">⬅ Voltar ao Início</a>
                
                <h2>Nova Ordem de Serviço</h2>

                <form id="os-form" style="margin-top: 20px;">
                    <!-- Seleção de Cliente -->
                    <div style="margin-bottom: 15px;">
                        <label style="display: block; font-weight: bold; margin-bottom: 5px;">Cliente:</label>
                        <select id="client-select" required style="width: 100%; padding: 8px; box-sizing: border-box;">
                            <option value="">A carregar clientes...</option>
                        </select>
                    </div>

                    <!-- Dados do Equipamento -->
                    <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px;">
                        <div style="flex: 1; min-width: 200px;">
                            <label style="display: block; font-weight: bold; margin-bottom: 5px;">Equipamento:</label>
                            <input type="text" id="equipment" required style="width: 100%; padding: 8px; box-sizing: border-box;">
                        </div>
                        <div style="flex: 1; min-width: 200px;">
                            <label style="display: block; font-weight: bold; margin-bottom: 5px;">Marca:</label>
                            <input type="text" id="brand" style="width: 100%; padding: 8px; box-sizing: border-box;">
                        </div>
                    </div>

                    <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px;">
                        <div style="flex: 1; min-width: 200px;">
                            <label style="display: block; font-weight: bold; margin-bottom: 5px;">Modelo:</label>
                            <input type="text" id="model" style="width: 100%; padding: 8px; box-sizing: border-box;">
                        </div>
                        <div style="flex: 1; min-width: 200px;">
                            <label style="display: block; font-weight: bold; margin-bottom: 5px;">Matrícula / N° de Série:</label>
                            <input type="text" id="serial-number" style="width: 100%; padding: 8px; box-sizing: border-box;">
                        </div>
                    </div>

                    <!-- Tipo e Área de Serviço -->
                    <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px;">
                        <div style="flex: 1; min-width: 200px;">
                            <label style="display: block; font-weight: bold; margin-bottom: 5px;">Tipo de Manutenção:</label>
                            <select id="service-nature" style="width: 100%; padding: 8px; box-sizing: border-box;">
                                <option value="Corretiva">Corretiva</option>
                                <option value="Preventiva">Preventiva</option>
                                <option value="Garantia">Garantia</option>
                            </select>
                        </div>
                        <div style="flex: 1; min-width: 200px;">
                            <label style="display: block; font-weight: bold; margin-bottom: 5px;">Área de Serviço:</label>
                            <select id="service-area" required style="width: 100%; padding: 8px; box-sizing: border-box;">
                                <option value="Elétrica">Elétrica</option>
                                <option value="Mecânica">Mecânica</option>
                            </select>
                        </div>
                    </div>

                    <!-- CRITÉRIOS DE COBRANÇA E DESLOCAÇÃO -->
                    <div style="background: #f8f9fa; padding: 15px; border-radius: 6px; margin-bottom: 15px; border: 1px solid #ddd;">
                        <h3 style="font-size: 15px; margin-top: 0; color: #2c3e50; margin-bottom: 15px;">Critérios de Cobrança e Deslocação</h3>
                        
                        <!-- 1. HORA TRABALHADA -->
                        <div style="margin-bottom: 12px;">
                            <label style="display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px;">Cobrar Hora Trabalhada?</label>
                            <select id="tem-hora" style="width: 100%; padding: 8px; box-sizing: border-box;">
                                <option value="sim">Sim</option>
                                <option value="nao">Não</option>
                            </select>
                        </div>

                        <!-- Turnos e Valor da Hora -->
                        <div id="bloco-turnos" style="background: #fff; padding: 10px; border-radius: 4px; border: 1px solid #ccc; margin-bottom: 15px;">
                            <div style="margin-bottom: 10px;">
                                <label style="display: block; font-weight: bold; margin-bottom: 3px; font-size: 12px;">Valor da Hora (R$):</label>
                                <input type="number" step="0.01" id="valor-hora" value="200.00" style="width: 100%; padding: 6px; box-sizing: border-box;">
                            </div>
                            <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px;">
                                <div style="flex: 1; min-width: 180px;">
                                    <label style="display: block; font-weight: bold; margin-bottom: 3px; font-size: 12px;">Início Manhã:</label>
                                    <input type="datetime-local" id="time-start-manha" style="width: 100%; padding: 6px; box-sizing: border-box;">
                                </div>
                                <div style="flex: 1; min-width: 180px;">
                                    <label style="display: block; font-weight: bold; margin-bottom: 3px; font-size: 12px;">Final Manhã:</label>
                                    <input type="datetime-local" id="time-end-manha" style="width: 100%; padding: 6px; box-sizing: border-box;">
                                </div>
                            </div>
                            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                                <div style="flex: 1; min-width: 180px;">
                                    <label style="display: block; font-weight: bold; margin-bottom: 3px; font-size: 12px;">Início Tarde:</label>
                                    <input type="datetime-local" id="time-start-tarde" style="width: 100%; padding: 6px; box-sizing: border-box;">
                                </div>
                                <div style="flex: 1; min-width: 180px;">
                                    <label style="display: block; font-weight: bold; margin-bottom: 3px; font-size: 12px;">Final Tarde (Encerramento):</label>
                                    <input type="datetime-local" id="time-end-tarde" style="width: 100%; padding: 6px; box-sizing: border-box;">
                                </div>
                            </div>
                        </div>

                        <!-- 2. KM RODADO -->
                        <div style="margin-bottom: 12px;">
                            <label style="display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px;">Cobrar Km Rodado?</label>
                            <select id="tem-km" style="width: 100%; padding: 8px; box-sizing: border-box;">
                                <option value="nao">Não</option>
                                <option value="sim">Sim</option>
                            </select>
                        </div>

                        <!-- Campos Km e Valor por Km -->
                        <div id="bloco-km" style="display: none; background: #fff; padding: 10px; border-radius: 4px; border: 1px solid #ccc; margin-bottom: 15px;">
                            <div style="margin-bottom: 10px;">
                                <label style="display: block; font-weight: bold; margin-bottom: 3px; font-size: 12px;">Valor por Km (R$):</label>
                                <input type="number" step="0.01" id="valor-km" placeholder="Ex: 2.50" style="width: 100%; padding: 6px; box-sizing: border-box;">
                            </div>
                            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                                <div style="flex: 1; min-width: 180px;">
                                    <label style="display: block; font-weight: bold; margin-bottom: 3px; font-size: 12px;">Km Ida:</label>
                                    <input type="number" step="0.1" id="km-ida" placeholder="Ex: 50" style="width: 100%; padding: 6px; box-sizing: border-box;">
                                </div>
                                <div style="flex: 1; min-width: 180px;">
                                    <label style="display: block; font-weight: bold; margin-bottom: 3px; font-size: 12px;">Km Volta:</label>
                                    <input type="number" step="0.1" id="km-volta" placeholder="Ex: 50" style="width: 100%; padding: 6px; box-sizing: border-box;">
                                </div>
                            </div>
                        </div>

                        <!-- 3. COMBUSTÍVEL -->
                        <div style="margin-bottom: 8px;">
                            <label style="display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px;">Adicionar Combustível?</label>
                            <select id="tem-combustivel" style="width: 100%; padding: 8px; box-sizing: border-box;">
                                <option value="nao">Não</option>
                                <option value="sim">Sim</option>
                            </select>
                        </div>

                        <!-- Campos Litros e Valor do Litro -->
                        <div id="bloco-combustivel" style="display: none; background: #fff; padding: 10px; border-radius: 4px; border: 1px solid #ccc;">
                            <div style="margin-bottom: 10px;">
                                <label style="display: block; font-weight: bold; margin-bottom: 3px; font-size: 12px;">Valor por Litro (R$):</label>
                                <input type="number" step="0.01" id="valor-litro" placeholder="Ex: 6.00" style="width: 100%; padding: 6px; box-sizing: border-box;">
                            </div>
                            <div>
                                <label style="display: block; font-weight: bold; margin-bottom: 3px; font-size: 12px;">Quantidade (Litros):</label>
                                <input type="number" step="0.1" id="combustivel-litros" placeholder="Ex: 15.5" style="width: 100%; padding: 6px; box-sizing: border-box;">
                            </div>
                        </div>
                    </div>

                    <!-- Técnico Responsável -->
                    <div style="margin-bottom: 15px;">
                        <label style="display: block; font-weight: bold; margin-bottom: 5px;">Técnico Responsável:</label>
                        <input type="text" id="technician-name" required style="width: 100%; padding: 8px; box-sizing: border-box;">
                    </div>

                    <!-- Descrição -->
                    <div style="margin-bottom: 15px;">
                        <label style="display: block; font-weight: bold; margin-bottom: 5px;">Descrição do Serviço:</label>
                        <textarea id="description" rows="4" style="width: 100%; padding: 8px; box-sizing: border-box;"></textarea>
                    </div>

                    <!-- ANEXOS DINÂMICOS COM NOME/RÓTULO -->
                    <div style="background: #f8f9fa; padding: 15px; border-radius: 6px; margin-bottom: 15px; border: 1px solid #ddd;">
                        <label style="display: block; font-weight: bold; margin-bottom: 10px; color: #2c3e50;">Fotografias / Anexos do Equipamento (com Nome/Rótulo):</label>
                        
                        <div id="container-anexos" style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px;">
                            <!-- Linha de Anexo Inicial -->
                            <div class="anexo-row" style="display: flex; gap: 10px; align-items: center; background: #fff; padding: 10px; border-radius: 4px; border: 1px solid #ccc;">
                                <input type="text" placeholder="Nome do anexo (Ex: Antes da Intervenção)" class="anexo-titulo" style="flex: 1; padding: 6px; box-sizing: border-box;">
                                <input type="file" accept="image/*" class="anexo-ficheiro" style="flex: 1; padding: 4px;">
                            </div>
                        </div>

                        <button type="button" id="btn-adicionar-anexo" style="padding: 6px 12px; background: #17a2b8; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold;">+ Adicionar outro anexo</button>
                    </div>

                    <!-- Condição de Pagamento -->
                    <div style="margin-bottom: 15px;">
                        <label style="display: block; font-weight: bold; margin-bottom: 5px;">Condição de Pagamento (Dias):</label>
                        <input type="text" id="payment-terms" placeholder="Ex: 30" required style="width: 100%; padding: 8px; box-sizing: border-box;">
                    </div>

                    <!-- Assinaturas -->
                    <div style="margin-top: 20px;">
                        <h4 style="margin-bottom: 5px;">Assinatura do Técnico Responsável</h4>
                        <canvas id="tech-pad" style="border: 1px solid #ccc; width: 100%; height: 150px; background: #fff; touch-action: none; border-radius: 4px;"></canvas>
                        <button type="button" id="clear-tech" style="margin-top: 5px; padding: 5px 10px; background: #6c757d; color: white; border: none; border-radius: 4px; cursor: pointer;">Limpar Assinatura</button>
                    </div>

                    <div style="margin-top: 20px;">
                        <h4 style="margin-bottom: 5px;">Assinatura do Cliente</h4>
                        <canvas id="client-pad" style="border: 1px solid #ccc; width: 100%; height: 150px; background: #fff; touch-action: none; border-radius: 4px;"></canvas>
                        <button type="button" id="clear-client" style="margin-top: 5px; padding: 5px 10px; background: #6c757d; color: white; border: none; border-radius: 4px; cursor: pointer;">Limpar Assinatura</button>
                    </div>

                    <div style="margin-top: 30px;">
                        <button type="submit" style="width: 100%; padding: 12px; background: #28a745; color: white; font-size: 16px; font-weight: bold; border: none; border-radius: 4px; cursor: pointer;">Guardar Ordem de Serviço</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <!-- Script para controlo visual dos blocos dinâmicos e anexos múltiplos -->
    <script>
        document.getElementById('tem-hora').addEventListener('change', function() {
            const bloco = document.getElementById('bloco-turnos');
            bloco.style.display = this.value === 'sim' ? 'block' : 'none';
        });

        document.getElementById('tem-km').addEventListener('change', function() {
            const bloco = document.getElementById('bloco-km');
            bloco.style.display = this.value === 'sim' ? 'block' : 'none';
        });

        document.getElementById('tem-combustivel').addEventListener('change', function() {
            const bloco = document.getElementById('bloco-combustivel');
            bloco.style.display = this.value === 'sim' ? 'block' : 'none';
        });

        // Adicionar linhas de anexos dinamicamente
        document.getElementById('btn-adicionar-anexo').addEventListener('click', function() {
            const container = document.getElementById('container-anexos');
            const novaLinha = document.createElement('div');
            novaLinha.className = 'anexo-row';
            novaLinha.style.cssText = 'display: flex; gap: 10px; align-items: center; background: #fff; padding: 10px; border-radius: 4px; border: 1px solid #ccc;';
            novaLinha.innerHTML = `
                <input type="text" placeholder="Nome do anexo (Ex: Depois da Limpeza)" class="anexo-titulo" style="flex: 1; padding: 6px; box-sizing: border-box;">
                <input type="file" accept="image/*" class="anexo-ficheiro" style="flex: 1; padding: 4px;">
                <button type="button" onclick="this.parentElement.remove()" style="background: #dc3545; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer;">X</button>
            `;
            container.appendChild(novaLinha);
        });
    </script>

    <script type="module">
        import { auth } from './js/firebase-config.js?v=1.5';
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        onAuthStateChanged(auth, (user) => {
            if (!user) window.location.href = 'login.html';
        });

        const menuToggle = document.getElementById('menuToggle');
        const sidebar = document.querySelector('.sidebar');
        if (menuToggle && sidebar) {
            menuToggle.addEventListener('click', (e) => {
                e.stopPropagation();
                sidebar.classList.toggle('active');
            });

            document.addEventListener('click', (event) => {
                if (sidebar.classList.contains('active')) {
                    if (!sidebar.contains(event.target) && !menuToggle.contains(event.target)) {
                        sidebar.classList.remove('active');
                    }
                }
            });
        }

        const btn.btnLogout = document.getElementById('btn-logout');
        if (btnLogout) {
            btnLogout.addEventListener('click', async (e) => {
                e.preventDefault();
                await signOut(auth);
                window.location.href = 'login.html';
            });
        }
    </script>

    <!-- Script principal da O.S. com Cache Busting (v=1.5) -->
    <script type="module" src="js/os.js?v=1.5"></script>
</body>
</html>
