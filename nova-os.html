<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Ordem de Serviço - RG Soluções Técnicas</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Signature Pad CDN -->
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Menu Lateral -->
        <aside class="sidebar">
            <div style="text-align: center; margin-bottom: 20px; padding: 10px;">
                <img src="img/logo.png" alt="RG Soluções Técnicas" style="max-width: 100%; height: auto; border-radius: 4px;">
            </div>
            <nav>
                <a href="index.html">🏠 Início</a>
                <a href="clientes.html">👥 Gestão de Clientes</a>
                <a href="nova-os.html" class="active">📋 Nova Ordem de Serviço</a>
                <a href="historico.html">📜 Histórico</a>
                <a href="#" id="btn-logout" style="margin-top: 30px; background: #dc3545; text-align: center;">🚪 Terminar Sessão</a>
            </nav>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="main-content">
            <button class="menu-toggle" id="menuToggle">☰ Menu</button>

            <div class="container" style="max-width: 800px;">
                <a href="index.html" class="voltar">⬅ Voltar ao Início</a>
                
                <h2>Nova Ordem de Serviço</h2>

                <form id="os-form" style="margin-top: 20px;">
                    <!-- Seleção de Cliente -->
                    <div style="margin-bottom: 15px;">
                        <label style="display: block; font-weight: bold; margin-bottom: 5px;">Cliente:</label>
                        <select id="client-select" required style="width: 100%; padding: 8px; box-sizing: border-box;">
                            <option value="">A carregar clientes...</option>
                        </select>
                    </div>

                    <!-- Dados do Equipamento -->
                    <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px;">
                        <div style="flex: 1; min-width: 200px;">
                            <label style="display: block; font-weight: bold; margin-bottom: 5px;">Equipamento:</label>
                            <input type="text" id="equipment" required style="width: 100%; padding: 8px; box-sizing: border-box;">
                        </div>
                        <div style="flex: 1; min-width: 200px;">
                            <label style="display: block; font-weight: bold; margin-bottom: 5px;">Marca:</label>
                            <input type="text" id="brand" style="width: 100%; padding: 8px; box-sizing: border-box;">
                        </div>
                    </div>

                    <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px;">
                        <div style="flex: 1; min-width: 200px;">
                            <label style="display: block; font-weight: bold; margin-bottom: 5px;">Modelo:</label>
                            <input type="text" id="model" style="width: 100%; padding: 8px; box-sizing: border-box;">
                        </div>
                        <div style="flex: 1; min-width: 200px;">
                            <label style="display: block; font-weight: bold; margin-bottom: 5px;">Matrícula / N° de Série:</label>
                            <input type="text" id="serial-number" style="width: 100%; padding: 8px; box-sizing: border-box;">
                        </div>
                    </div>

                    <!-- Tipo e Área -->
                    <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px;">
                        <div style="flex: 1; min-width: 200px;">
                            <label style="display: block; font-weight: bold; margin-bottom: 5px;">Tipo de Manutenção:</label>
                            <select id="service-nature" style="width: 100%; padding: 8px; box-sizing: border-box;">
                                <option value="Corretiva">Corretiva</option>
                                <option value="Preventiva">Preventiva</option>
                                <option value="Garantia">Garantia</option>
                            </select>
                        </div>
                        <div style="flex: 1; min-width: 200px;">
                            <label style="display: block; font-weight: bold; margin-bottom: 5px;">Área de Serviço:</label>
                            <input type="text" id="service-area" placeholder="Ex: Mecânica, Elétrica..." style="width: 100%; padding: 8px; box-sizing: border-box;">
                        </div>
                    </div>

                    <!-- Horários -->
                    <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px;">
                        <div style="flex: 1; min-width: 200px;">
                            <label style="display: block; font-weight: bold; margin-bottom: 5px;">Data e Hora de Início:</label>
                            <input type="datetime-local" id="time-start" required style="width: 100%; padding: 8px; box-sizing: border-box;">
                        </div>
                        <div style="flex: 1; min-width: 200px;">
                            <label style="display: block; font-weight: bold; margin-bottom: 5px;">Data e Hora de Fim (Opcional no campo):</label>
                            <input type="datetime-local" id="time-end" style="width: 100%; padding: 8px; box-sizing: border-box;">
                        </div>
                    </div>

                    <!-- Técnico Responsável -->
                    <div style="margin-bottom: 15px;">
                        <label style="display: block; font-weight: bold; margin-bottom: 5px;">Técnico Responsável:</label>
                        <input type="text" id="technician-name" required style="width: 100%; padding: 8px; box-sizing: border-box;">
                    </div>

                    <!-- Descrição -->
                    <div style="margin-bottom: 15px;">
                        <label style="display: block; font-weight: bold; margin-bottom: 5px;">Descrição do Serviço:</label>
                        <textarea id="description" rows="4" style="width: 100%; padding: 8px; box-sizing: border-box;"></textarea>
                    </div>

                    <!-- Assinaturas -->
                    <div style="margin-top: 20px;">
                        <h4 style="margin-bottom: 5px;">Assinatura do Técnico Responsável</h4>
                        <canvas id="tech-pad" style="border: 1px solid #ccc; width: 100%; height: 150px; background: #fff; touch-action: none; border-radius: 4px;"></canvas>
                        <button type="button" id="clear-tech" style="margin-top: 5px; padding: 5px 10px; background: #6c757d; color: white; border: none; border-radius: 4px; cursor: pointer;">Limpar Assinatura</button>
                    </div>

                    <div style="margin-top: 20px;">
                        <h4 style="margin-bottom: 5px;">Assinatura do Cliente</h4>
                        <canvas id="client-pad" style="border: 1px solid #ccc; width: 100%; height: 150px; background: #fff; touch-action: none; border-radius: 4px;"></canvas>
                        <button type="button" id="clear-client" style="margin-top: 5px; padding: 5px 10px; background: #6c757d; color: white; border: none; border-radius: 4px; cursor: pointer;">Limpar Assinatura</button>
                    </div>

                    <div style="margin-top: 30px;">
                        <button type="submit" style="width: 100%; padding: 12px; background: #28a745; color: white; font-size: 16px; font-weight: bold; border: none; border-radius: 4px; cursor: pointer;">Guardar Ordem de Serviço</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script type="module" src="js/os.js"></script>
</body>
</html>
