<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico de Ordens de Serviço - Assistência Técnica</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Biblioteca jsPDF para gerar os relatórios em PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Menu Lateral (Sidebar) -->
        <aside class="sidebar">
            <h2>Assistência Técnica</h2>
            <nav>
                <a href="index.html">🏠 Início</a>
                <a href="clientes.html">👥 Gestão de Clientes</a>
                <a href="nova-os.html">📋 Nova Ordem de Serviço</a>
                <a href="historico.html" class="active">📜 Histórico</a>
                <a href="#" id="btn-logout" style="margin-top: 30px; background: #dc3545; text-align: center;">🚪 Terminar Sessão</a>
            </nav>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="main-content">
            <!-- Botão de menu para telemóveis -->
            <button class="menu-toggle" id="menuToggle">☰ Menu</button>

            <div class="container" style="max-width: 800px;">
                <a href="index.html" class="voltar">⬅ Voltar ao Início</a>
                
                <h2>Histórico de Ordens de Serviço</h2>
                
                <!-- Secção de Filtros de Pesquisa -->
                <div style="background: #f8f9fa; padding: 15px; border-radius: 6px; margin-top: 20px; border: 1px solid #ddd;">
                    <h3 style="font-size: 16px; margin-top: 0; color: #2c3e50;">Filtros de Pesquisa</h3>
                    
                    <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px;">
                        <!-- Filtro por Cliente -->
                        <div style="flex: 1; min-width: 200px;">
                            <label style="font-size: 13px; font-weight: bold;">Cliente:</label>
                            <select id="filter-client" style="margin-top: 4px;">
                                <option value="">Todos os clientes</option>
                            </select>
                        </div>
                        
                        <!-- Filtro por Tipo de Manutenção -->
                        <div style="flex: 1; min-width: 160px;">
                            <label style="font-size: 13px; font-weight: bold;">Tipo de Manutenção:</label>
                            <select id="filter-type" style="margin-top: 4px;">
                                <option value="">Todos os tipos</option>
                                <option value="Corretiva">Corretiva</option>
                                <option value="Preventiva">Preventiva</option>
                                <option value="Garantia">Garantia</option>
                            </select>
                        </div>
                    </div>

                    <div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end;">
                        <!-- Data Início -->
                        <div style="flex: 1; min-width: 140px;">
                            <label style="font-size: 13px; font-weight: bold;">Data Início:</label>
                            <input type="date" id="filter-start" style="margin-top: 4px;">
                        </div>
                        
                        <!-- Data Fim -->
                        <div style="flex: 1; min-width: 140px;">
                            <label style="font-size: 13px; font-weight: bold;">Data Fim:</label>
                            <input type="date" id="filter-end" style="margin-top: 4px;">
                        </div>

                        <!-- Botão Aplicar -->
                        <div>
                            <button type="button" id="apply-filters" style="padding: 11px 20px; background: #007bff; margin-top: 4px; color: white; border: none; border-radius: 4px; cursor: pointer;">Filtrar</button>
                        </div>
                    </div>
                </div>

                <!-- Lista de Ordens de Serviço -->
                <div style="margin-top: 25px;">
                    <div id="history-list">
                        <p style="color: #666; text-align: center;">A carregar histórico...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Script de Gestão, Filtros, PDF e Firebase -->
    <script type="module">
        import { db, auth } from './js/firebase-config.js';
        import { collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Verifica Autenticação
        onAuthStateChanged(auth, (user) => {
            if (!user) window.location.href = 'login.html';
        });

        // Controlo do Menu Mobile
        const menuToggle = document.getElementById('menuToggle');
        const sidebar = document.querySelector('.sidebar');
        if (menuToggle) {
            menuToggle.addEventListener('click', () => {
                sidebar.classList.toggle('active');
            });
        }

        document.getElementById('btn-logout').addEventListener('click', async (e) => {
            e.preventDefault();
            await signOut(auth);
            window.location.href = 'login.html';
        });

        let allOrders = [];
        let clientsMap = {};

        // Carregar Clientes para preencher o select do filtro
        async function loadClientsFilter() {
            try {
                const querySnapshot = await getDocs(collection(db, "clients"));
                const selectClient = document.getElementById('filter-client');
                querySnapshot.forEach((docSnap) => {
                    const client = docSnap.data();
                    clientsMap[docSnap.id] = client.name || client.razaoSocial;
                    const option = document.createElement('option');
                    option.value = docSnap.id;
                    option.textContent = client.name || client.razaoSocial;
                    selectClient.appendChild(option);
                });
            } catch (error) {
                console.error("Erro ao carregar clientes para o filtro:", error);
            }
        }

        // Carregar Histórico do Firestore (Mais recente no topo)
        async function loadHistory() {
            const historyListDiv = document.getElementById('history-list');
            try {
                const q = query(collection(db, "service_orders"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                
                allOrders = [];
                querySnapshot.forEach((docSnap) => {
                    allOrders.push({ id: docSnap.id, ...docSnap.data() });
                });

                renderHistory(allOrders);
            } catch (error) {
                console.error("Erro ao carregar histórico:", error);
                historyListDiv.innerHTML = "<p style='color: red;'>Erro ao carregar os dados do histórico.</p>";
            }
        }

        // Renderizar a lista de ordens de serviço no ecrã com valores e botão de PDF
        function renderHistory(orders) {
            const historyListDiv = document.getElementById('history-list');
            historyListDiv.innerHTML = "";

            if (orders.length === 0) {
                historyListDiv.innerHTML = "<p style='color: #666; text-align: center; padding: 20px;'>Nenhuma Ordem de Serviço encontrada com os filtros selecionados.</p>";
                return;
            }

            let html = "";
            orders.forEach(order => {
                const clientName = clientsMap[order.clientId] || order.clientName || "Cliente Desconhecido";
                const dataInicioFormatada = order.timeStart ? new Date(order.timeStart).toLocaleString('pt-PT') : 'N/A';

                html += `
                    <div style="background: #ffffff; border: 1px solid #e0e0e0; border-left: 5px solid #007bff; padding: 15px; border-radius: 6px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                            <strong style="font-size: 16px; color: #2c3e50;">${clientName}</strong>
                            <span style="background: #e9ecef; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; color: #495057;">${order.serviceNature || 'Corretiva'}</span>
                        </div>
                        <p style="margin: 4px 0; font-size: 14px; color: #555;"><strong>Equipamento:</strong> ${order.equipment || 'N/A'} (Marca: ${order.brand || '-'}, Modelo: ${order.model || '-'})</p>
                        <p style="margin: 4px 0; font-size: 14px; color: #555;"><strong>Início:</strong> ${dataInicioFormatada} | <strong>Manutentor:</strong> ${order.technicianName || 'N/A'}</p>
                        
                        <!-- Resumo Financeiro na Listagem -->
                        <p style="margin: 4px 0; font-size: 13px; color: #444;">
                            <strong>Horas:</strong> ${order.totalHours || '0'}h (${order.valorDasHoras || '0.00'}€) | <strong>Mão de Obra:</strong> ${order.laborValueManual || '0.00'}€
                        </p>
                        <p style="margin: 4px 0; font-size: 14px;">
                            <strong>Valor Total:</strong> <span style="color: #28a745; font-weight: bold;">${order.totalValue || '0.00'}€</span>
                        </p>

                        <p style="margin: 8px 0 12px 0; font-size: 13px; color: #666; background: #f8f9fa; padding: 8px; border-radius: 4px;"><em>"${order.description || 'Sem descrição'}"</em></p>

                        <!-- Botão para Gerar PDF e Partilhar -->
                        <div>
                            <button onclick="gerarEPartilharPDF('${order.id}')" style="background: #28a745; color: white; border: none; padding: 8px 14px; cursor: pointer; border-radius: 4px; font-size: 13px; font-weight: bold;">
                                📄 Gerar Relatório e Encaminhar
                            </button>
                        </div>
                    </div>
                `;
            });
            historyListDiv.innerHTML = html;
        }

        // Função global para gerar o PDF e abrir as opções de partilha nativa com o ficheiro anexo
        window.gerarEPartilharPDF = async function(osId) {
            try {
                const order = allOrders.find(item => item.id === osId);
                if (!order) {
                    alert("Ordem de Serviço não encontrada!");
                    return;
                }

                const { jsPDF } = window.jspdf;
                const docPDF = new jsPDF();

                // Construção do documento PDF
                docPDF.setFont("helvetica", "bold");
                docPDF.setFontSize(16);
                docPDF.text("Relatório de Assistência Técnica", 20, 20);

                docPDF.setFontSize(11);
                docPDF.setFont("helvetica", "normal");
                const clientNameDisplay = clientsMap[order.clientId] || order.clientName || 'N/A';
                docPDF.text(`Cliente: ${clientNameDisplay}`, 20, 32);
                docPDF.text(`Equipamento: ${order.equipment || 'N/A'} (Marca: ${order.brand || '-'} / Mod: ${order.model || '-'})`, 20, 40);
                docPDF.text(`Tipo de Serviço: ${order.serviceNature || ''} - ${order.serviceArea || ''}`, 20, 48);
                docPDF.text(`Manutentor: ${order.technicianName || 'N/A'}`, 20, 56);
                docPDF.text(`Início: ${order.timeStart || '-'} | Fim: ${order.timeEnd || '-'}`, 20, 64);
                
                docPDF.setFont("helvetica", "bold");
                docPDF.text("Descrição do Serviço:", 20, 76);
                docPDF.setFont("helvetica", "normal");
                
                const splitDescription = docPDF.splitTextToSize(order.description || 'Sem descrição', 170);
                docPDF.text(splitDescription, 20, 84);

                let posY = 95 + (splitDescription.length * 5);

                // Resumo Financeiro no PDF
                docPDF.setFont("helvetica", "bold");
                docPDF.text("Resumo Financeiro:", 20, posY);
                docPDF.setFont("helvetica", "normal");
                docPDF.text(`- Horas Trabalhadas: ${order.totalHours || '0'}h (Valor Horas: ${order.valorDasHoras || '0.00'}€)`, 20, posY + 8);
                docPDF.text(`- Mão de Obra Manual: ${order.laborValueManual || '0.00'}€`, 20, posY + 16);
                docPDF.setFont("helvetica", "bold");
                docPDF.text(`- Valor Total: ${order.totalValue || '0.00'}€`, 20, posY + 24);

                posY += 38;

                // Inserir assinaturas se existirem
                if (order.technicianSignature) {
                    docPDF.addImage(order.technicianSignature, 'PNG', 20, posY, 60, 25);
                    docPDF.text("Assinatura Manutentor", 20, posY + 30);
                }

                if (order.customerSignature) {
                    docPDF.addImage(order.customerSignature, 'PNG', 120, posY, 60, 25);
                    docPDF.text("Assinatura Cliente", 120, posY + 30);
                }

                // Criar o ficheiro PDF em formato Blob e objeto File
                const pdfBlob = docPDF.output('blob');
                const fileName = `Relatorio_OS_${osId.substring(0, 6)}.pdf`;
                const pdfFile = new File([pdfBlob], fileName, { type: 'application/pdf' });

                // Tentar partilha nativa do dispositivo (WhatsApp, E-mail, etc.)
                if (navigator.canShare && navigator.canShare({ files: [pdfFile] })) {
                    try {
                        await navigator.share({
                            title: 'Relatório de Assistência Técnica',
                            text: `Segue o relatório técnico referente ao equipamento ${order.equipment}.`,
                            files: [pdfFile],
                        });
                        return;
                    } catch (error) {
                        if (error.name === 'AbortError') return; // Cancelado pelo utilizador
                    }
                }

                // Fallback caso o navegador não suporte partilha direta de ficheiros
                const pdfUrl = URL.createObjectURL(pdfBlob);
                const downloadLink = document.createElement('a');
                downloadLink.href = pdfUrl;
                downloadLink.download = fileName;
                document.body.appendChild(downloadLink);
                downloadLink.click();
                document.body.removeChild(downloadLink);
                alert("Relatório PDF gerado e descarregado com sucesso!");

            } catch (error) {
                console.error("Erro ao gerar o relatório PDF:", error);
                alert("Ocorreu um erro ao processar o relatório.");
            }
        };

        // Lógica de Filtro Dinâmico
        document.getElementById('apply-filters').addEventListener('click', () => {
            const selectedClient = document.getElementById('filter-client').value;
            const selectedType = document.getElementById('filter-type').value;
            const startDate = document.getElementById('filter-start').value;
            const endDate = document.getElementById('filter-end').value;

            const filtered = allOrders.filter(order => {
                if (selectedClient && order.clientId !== selectedClient) {
                    return false;
                }
                if (selectedType && order.serviceNature !== selectedType) {
                    return false;
                }
                if (order.timeStart) {
                    const orderDateStr = order.timeStart.split('T')[0];
                    if (startDate && orderDateStr < startDate) {
                        return false;
                    }
                    if (endDate && orderDateStr > endDate) {
                        return false;
                    }
                }
                return true;
            });

            renderHistory(filtered);
        });

        // Inicialização ao carregar a página
        window.addEventListener('DOMContentLoaded', async () => {
            await loadClientsFilter();
            await loadHistory();
        });
    </script>
</body>
</html>
