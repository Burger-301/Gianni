<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início / Histórico - RG Soluções Técnicas</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Biblioteca jsPDF para gerar os relatórios em PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Menu Lateral (Sidebar) com o Logótipo -->
        <aside class="sidebar">
            <div style="text-align: center; margin-bottom: 20px; padding: 10px;">
                <img src="img/logo.png" alt="RG Soluções Técnicas" style="max-width: 100%; height: auto; border-radius: 4px;">
            </div>
            <nav>
                <a href="historico.html" class="active">🏠 Início / Histórico</a>
                <a href="clientes.html">👥 Gestão de Clientes</a>
                <a href="nova-os.html">📋 Nova Ordem de Serviço</a>
                <a href="#" id="btn-logout" style="margin-top: 30px; background: #dc3545; text-align: center;">🚪 Terminar Sessão</a>
            </nav>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="main-content">
            <!-- Botão de menu para telemóveis -->
            <button class="menu-toggle" id="menuToggle">☰ Menu</button>

            <div class="container" style="max-width: 800px;">
                <h2>Histórico de Ordens de Serviço</h2>
                
                <!-- Secção de Filtros de Pesquisa -->
                <div style="background: #f8f9fa; padding: 15px; border-radius: 6px; margin-top: 20px; border: 1px solid #ddd;">
                    <h3 style="font-size: 16px; margin-top: 0; color: #2c3e50;">Filtros de Pesquisa</h3>
                    
                    <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px;">
                        <!-- Filtro por Cliente -->
                        <div style="flex: 1; min-width: 200px;">
                            <label style="font-size: 13px; font-weight: bold;">Cliente:</label>
                            <select id="filter-client" style="margin-top: 4px;">
                                <option value="">Todos os clientes</option>
                            </select>
                        </div>
                        
                        <!-- Filtro por Tipo de Manutenção -->
                        <div style="flex: 1; min-width: 160px;">
                            <label style="font-size: 13px; font-weight: bold;">Tipo de Manutenção:</label>
                            <select id="filter-type" style="margin-top: 4px;">
                                <option value="">Todos os tipos</option>
                                <option value="Corretiva">Corretiva</option>
                                <option value="Preventiva">Preventiva</option>
                                <option value="Garantia">Garantia</option>
                            </select>
                        </div>
                    </div>

                    <div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end;">
                        <!-- Data Início -->
                        <div style="flex: 1; min-width: 140px;">
                            <label style="font-size: 13px; font-weight: bold;">Data Início:</label>
                            <input type="date" id="filter-start" style="margin-top: 4px;">
                        </div>
                        
                        <!-- Data Fim -->
                        <div style="flex: 1; min-width: 140px;">
                            <label style="font-size: 13px; font-weight: bold;">Data Fim:</label>
                            <input type="date" id="filter-end" style="margin-top: 4px;">
                        </div>

                        <!-- Botão Aplicar -->
                        <div>
                            <button type="button" id="apply-filters" style="padding: 11px 20px; background: #007bff; margin-top: 4px; color: white; border: none; border-radius: 4px; cursor: pointer;">Filtrar</button>
                        </div>
                    </div>
                </div>

                <!-- Lista de Ordens de Serviço -->
                <div style="margin-top: 25px;">
                    <div id="history-list">
                        <p style="color: #666; text-align: center;">A carregar histórico...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Personalizado para Selecionar Data e Hora de Fim -->
    <div id="modal-hora-fim" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;">
        <div style="background: white; padding: 25px; border-radius: 8px; width: 90%; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
            <h3 style="margin-top: 0; color: #2c3e50; font-size: 18px;">Registar Data e Hora de Fim</h3>
            <p style="font-size: 14px; color: #555; margin-bottom: 15px;">Selecione a data e hora de conclusão:</p>
            
            <input type="datetime-local" id="input-nova-hora" style="width: 100%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; margin-bottom: 20px;">
            
            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button type="button" id="btn-cancelar-modal" style="background: #6c757d; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer;">Cancelar</button>
                <button type="button" id="btn-salvar-modal" style="background: #28a745; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold;">Salvar</button>
            </div>
        </div>
    </div>

    <!-- Modal para Editar Ordem de Serviço -->
    <div id="modal-editar-os" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; overflow-y: auto;">
        <div style="background: white; padding: 25px; border-radius: 8px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
            <h3 style="margin-top: 0; color: #2c3e50; font-size: 18px;">Editar Ordem de Serviço</h3>
            
            <div style="margin-bottom: 12px;">
                <label style="font-size: 13px; font-weight: bold;">Equipamento:</label>
                <input type="text" id="edit-equipment" style="width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box;">
            </div>
            <div style="display: flex; gap: 10px; margin-bottom: 12px;">
                <div style="flex: 1;">
                    <label style="font-size: 13px; font-weight: bold;">Marca:</label>
                    <input type="text" id="edit-brand" style="width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box;">
                </div>
                <div style="flex: 1;">
                    <label style="font-size: 13px; font-weight: bold;">Modelo:</label>
                    <input type="text" id="edit-model" style="width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box;">
                </div>
            </div>
            <div style="margin-bottom: 12px;">
                <label style="font-size: 13px; font-weight: bold;">Matrícula / N° de Série:</label>
                <input type="text" id="edit-serial" style="width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box;">
            </div>
            <div style="display: flex; gap: 10px; margin-bottom: 12px;">
                <div style="flex: 1;">
                    <label style="font-size: 13px; font-weight: bold;">Tipo de Manutenção:</label>
                    <select id="edit-nature" style="width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box;">
                        <option value="Corretiva">Corretiva</option>
                        <option value="Preventiva">Preventiva</option>
                        <option value="Garantia">Garantia</option>
                    </select>
                </div>
                <div style="flex: 1;">
                    <label style="font-size: 13px; font-weight: bold;">Condição Pagamento (dias):</label>
                    <input type="text" id="edit-payment" style="width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box;">
                </div>
            </div>
            <div style="margin-bottom: 20px;">
                <label style="font-size: 13px; font-weight: bold;">Descrição do Serviço:</label>
                <textarea id="edit-description" rows="3" style="width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box;"></textarea>
            </div>
            
            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button type="button" id="btn-cancelar-edit" style="background: #6c757d; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer;">Cancelar</button>
                <button type="button" id="btn-salvar-edit" style="background: #007bff; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold;">Guardar Alterações</button>
            </div>
        </div>
    </div>

    <!-- Script de Gestão, Filtros, PDF com Logótipo e Firebase -->
    <script type="module">
        import { db, auth } from './js/firebase-config.js';
        import { collection, getDocs, doc, updateDoc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        onAuthStateChanged(auth, (user) => {
            if (!user) window.location.href = 'login.html';
        });

        const menuToggle = document.getElementById('menuToggle');
        const sidebar = document.querySelector('.sidebar');
        if (menuToggle && sidebar) {
            menuToggle.addEventListener('click', (e) => {
                e.stopPropagation();
                sidebar.classList.toggle('active');
            });

            // Fechar o menu ao clicar fora dele
            document.addEventListener('click', (event) => {
                if (sidebar.classList.contains('active')) {
                    if (!sidebar.contains(event.target) && !menuToggle.contains(event.target)) {
                        sidebar.classList.remove('active');
                    }
                }
            });
        }

        document.getElementById('btn-logout').addEventListener('click', async (e) => {
            e.preventDefault();
            await signOut(auth);
            window.location.href = 'login.html';
        });

        let allOrders = [];
        let clientsMap = {};
        let activeOsIdForHoraFim = null;
        let activeOsIdForEdit = null;

        async function getBase64ImageFromUrl(imageUrl) {
            try {
                const response = await fetch(imageUrl);
                const blob = await response.blob();
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onloadend = () => resolve(reader.result);
                    reader.onerror = reject;
                    reader.readAsDataURL(blob);
                });
            } catch (e) {
                console.warn("Não foi possível carregar o logótipo para o PDF:", e);
                return null;
            }
        }

        async function loadClientsFilter() {
            try {
                const querySnapshot = await getDocs(collection(db, "clients"));
                const selectClient = document.getElementById('filter-client');
                querySnapshot.forEach((docSnap) => {
                    const client = docSnap.data();
                    clientsMap[docSnap.id] = client;
                    const option = document.createElement('option');
                    option.value = docSnap.id;
                    option.textContent = client.name || client.razaoSocial;
                    selectClient.appendChild(option);
                });
            } catch (error) {
                console.error("Erro ao carregar clientes para o filtro:", error);
            }
        }

        async function loadHistory() {
            const historyListDiv = document.getElementById('history-list');
            try {
                const q = query(collection(db, "service_orders"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                
                allOrders = [];
                querySnapshot.forEach((docSnap) => {
                    allOrders.push({ id: docSnap.id, ...docSnap.data() });
                });

                renderHistory(allOrders);
            } catch (error) {
                console.error("Erro ao carregar histórico:", error);
                historyListDiv.innerHTML = "<p style='color: red;'>Erro ao carregar os dados do histórico.</p>";
            }
        }

        function renderHistory(orders) {
            const historyListDiv = document.getElementById('history-list');
            historyListDiv.innerHTML = "";

            if (orders.length === 0) {
                historyListDiv.innerHTML = "<p style='color: #666; text-align: center; padding: 20px;'>Nenhuma Ordem de Serviço encontrada com os filtros selecionados.</p>";
                return;
            }

            let html = "";
            orders.forEach(order => {
                const clientInfo = clientsMap[order.clientId] || {};
                const clientName = clientInfo.name || order.clientName || "Cliente Desconhecido";
                const dataInicioFormatada = order.timeStart ? new Date(order.timeStart).toLocaleString('pt-PT') : 'N/A';
                
                const temHoraFim = order.timeEnd && order.timeEnd !== "";
                const dataFimFormatada = temHoraFim ? new Date(order.timeEnd).toLocaleString('pt-PT') : '<span style="color: #d9534f; font-weight: bold;">Pendente de conclusão</span>';

                html += `
                    <div style="background: #ffffff; border: 1px solid #e0e0e0; border-left: 5px solid #007bff; padding: 15px; border-radius: 6px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                            <strong style="font-size: 16px; color: #2c3e50;">${clientName}</strong>
                            <span style="background: #e9ecef; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; color: #495057;">${order.serviceNature || 'Corretiva'}</span>
                        </div>
                        <p style="margin: 4px 0; font-size: 14px; color: #555;"><strong>Equipamento:</strong> ${order.equipment || 'N/A'} (Marca: ${order.brand || '-'}, Modelo: ${order.model || '-'}, Matrícula/Série: ${order.serialNumber || '-'})</p>
                        <p style="margin: 4px 0; font-size: 14px; color: #555;"><strong>Início:</strong> ${dataInicioFormatada} | <strong>Fim:</strong> ${dataFimFormatada}</p>
                        
                        <p style="margin: 4px 0; font-size: 13px; color: #444;">
                            <strong>Horas:</strong> ${order.totalHours || '0'}h | <strong>Pagamento:</strong> Para ${order.paymentTerms || '-'} dias
                        </p>
                        <p style="margin: 4px 0; font-size: 14px;">
                            <strong>Valor Total:</strong> <span style="color: #28a745; font-weight: bold;">R$ ${order.totalValue || '0.00'}</span>
                        </p>

                        <p style="margin: 8px 0 12px 0; font-size: 13px; color: #666; background: #f8f9fa; padding: 8px; border-radius: 4px;"><em>"${order.description || 'Sem descrição'}"</em></p>

                        <div style="margin-top: 12px; display: flex; gap: 10px; flex-wrap: wrap;">
                            <button onclick="gerarEPartilharPDF('${order.id}')" style="background: #28a745; color: white; border: none; padding: 8px 14px; cursor: pointer; border-radius: 4px; font-size: 13px; font-weight: bold;">
                                📄 Gerar Relatório
                            </button>
                            <button onclick="adicionarHoraFim('${order.id}')" style="background: #ffc107; color: #333; border: none; padding: 8px 14px; cursor: pointer; border-radius: 4px; font-size: 13px; font-weight: bold;">
                                ⏱️ ${temHoraFim ? 'Editar Hora Fim' : 'Adicionar Hora Fim'}
                            </button>
                            <button onclick="abrirModalEditar('${order.id}')" style="background: #17a2b8; color: white; border: none; padding: 8px 14px; cursor: pointer; border-radius: 4px; font-size: 13px; font-weight: bold;">
                                ✏️ Editar
                            </button>
                            <button onclick="excluirOS('${order.id}')" style="background: #dc3545; color: white; border: none; padding: 8px 14px; cursor: pointer; border-radius: 4px; font-size: 13px; font-weight: bold;">
                                🗑️ Excluir
                            </button>
                        </div>
                    </div>
                `;
            });
            historyListDiv.innerHTML = html;
        }

        window.adicionarHoraFim = function(osId) {
            activeOsIdForHoraFim = osId;
            const agora = new Date();
            const ano = agora.getFullYear();
            const mes = String(agora.getMonth() + 1).padStart(2, '0');
            const dia = String(agora.getDate()).padStart(2, '0');
            const hora = String(agora.getHours()).padStart(2, '0');
            const min = String(agora.getMinutes()).padStart(2, '0');
            document.getElementById('input-nova-hora').value = `${ano}-${mes}-${dia}T${hora}:${min}`;

            document.getElementById('modal-hora-fim').style.display = 'flex';
        };

        document.getElementById('btn-cancelar-modal').addEventListener('click', () => {
            document.getElementById('modal-hora-fim').style.display = 'none';
            activeOsIdForHoraFim = null;
        });

        document.getElementById('btn-salvar-modal').addEventListener('click', async () => {
            const novaHora = document.getElementById('input-nova-hora').value;
            if (!novaHora) {
                alert("Por favor, selecione uma data e hora válidas.");
                return;
            }

            const osId = activeOsIdForHoraFim;
            const order = allOrders.find(item => item.id === osId);
            if (!order) return;

            const start = new Date(order.timeStart);
            const end = new Date(novaHora);
            const diffMs = end - start;
            const diffHours = diffMs > 0 ? diffMs / (1000 * 60 * 60) : 0;
            
            const VALOR_HORA_FIXO = 200.00; 
            const valorDasHoras = diffHours * VALOR_HORA_FIXO;
            const totalValue = valorDasHoras;

            try {
                const docRef = doc(db, "service_orders", osId);
                await updateDoc(docRef, {
                    timeEnd: novaHora,
                    totalHours: diffHours.toFixed(2),
                    totalValue: totalValue.toFixed(2)
                });

                document.getElementById('modal-hora-fim').style.display = 'none';
                alert("Data/Hora de fim e valores atualizados com sucesso!");
                loadHistory();
            } catch (error) {
                console.error("Erro ao atualizar data/hora final:", error);
                alert("Ocorreu um erro ao atualizar os dados.");
            }
        });

        // Funções para Editar O.S.
        window.abrirModalEditar = function(osId) {
            activeOsIdForEdit = osId;
            const order = allOrders.find(item => item.id === osId);
            if (!order) return;

            document.getElementById('edit-equipment').value = order.equipment || '';
            document.getElementById('edit-brand').value = order.brand || '';
            document.getElementById('edit-model').value = order.model || '';
            document.getElementById('edit-serial').value = order.serialNumber || '';
            document.getElementById('edit-nature').value = order.serviceNature || 'Corretiva';
            document.getElementById('edit-payment').value = order.paymentTerms || '';
            document.getElementById('edit-description').value = order.description || '';

            document.getElementById('modal-editar-os').style.display = 'flex';
        };

        document.getElementById('btn-cancelar-edit').addEventListener('click', () => {
            document.getElementById('modal-editar-os').style.display = 'none';
            activeOsIdForEdit = null;
        });

        document.getElementById('btn-salvar-edit').addEventListener('click', async () => {
            const osId = activeOsIdForEdit;
            if (!osId) return;

            const updatedData = {
                equipment: document.getElementById('edit-equipment').value,
                brand: document.getElementById('edit-brand').value,
                model: document.getElementById('edit-model').value,
                serialNumber: document.getElementById('edit-serial').value,
                serviceNature: document.getElementById('edit-nature').value,
                paymentTerms: document.getElementById('edit-payment').value,
                description: document.getElementById('edit-description').value
            };

            try {
                const docRef = doc(db, "service_orders", osId);
                await updateDoc(docRef, updatedData);

                document.getElementById('modal-editar-os').style.display = 'none';
                alert("Ordem de Serviço atualizada com sucesso!");
                loadHistory();
            } catch (error) {
                console.error("Erro ao atualizar O.S.:", error);
                alert("Ocorreu um erro ao atualizar a Ordem de Serviço.");
            }
        });

        // Função para Excluir O.S.
        window.excluirOS = async function(osId) {
            if (confirm("Tem a certeza de que pretende eliminar esta Ordem de Serviço do histórico?")) {
                try {
                    await deleteDoc(doc(db, "service_orders", osId));
                    alert("Ordem de Serviço eliminada com sucesso!");
                    loadHistory();
                } catch (error) {
                    console.error("Erro ao eliminar O.S.:", error);
                    alert("Ocorreu um erro ao eliminar a Ordem de Serviço.");
                }
            }
        };

        window.gerarEPartilharPDF = async function(osId) {
            try {
                const order = allOrders.find(item => item.id === osId);
                if (!order) {
                    alert("Ordem de Serviço não encontrada!");
                    return;
                }

                const clientInfo = clientsMap[order.clientId] || {};
                const { jsPDF } = window.jspdf;
                const docPDF = new jsPDF();

                const empresa = {
                    nome: "RG Soluções Técnicas",
                    razaoSocial: "RG Soluções Técnicas Ltda",
                    email: "gcrodeghiero@gmail.com",
                    cnpj: "54.875.741/0001-45"
                };

                const dataEmissao = new Date().toLocaleDateString('pt-BR');

                const logoBase64 = await getBase64ImageFromUrl('img/logo.png');
                if (logoBase64) {
                    docPDF.addImage(logoBase64, 'PNG', 20, 10, 32, 14);
                }

                docPDF.setFont("helvetica", "bold");
                docPDF.setFontSize(13);
                docPDF.text("Orçamento / Manutenção Técnica", 58, 15);
                
                docPDF.setFontSize(9);
                docPDF.setFont("helvetica", "normal");
                docPDF.text(`Em: ${dataEmissao}`, 155, 15);

                docPDF.setLineWidth(0.4);
                docPDF.line(20, 27, 190, 27);

                let y = 33;

                // Empresa Responsável
                docPDF.setFillColor(230, 235, 245);
                docPDF.rect(20, y, 170, 7, 'F');
                docPDF.setFont("helvetica", "bold");
                docPDF.setFontSize(10);
                docPDF.text("Empresa responsável", 22, y + 5);

                y += 7;
                docPDF.setFont("helvetica", "normal");
                docPDF.setFontSize(9);
                docPDF.text(`Nome: ${empresa.nome}`, 22, y + 5);
                docPDF.text(`Razão social: ${empresa.razaoSocial}`, 105, y + 5);
                docPDF.text(`E-mail de contato: ${empresa.email}`, 22, y + 11);
                docPDF.text(`CNPJ: ${empresa.cnpj}`, 105, y + 11);

                y += 18;

                // Cliente
                docPDF.setFillColor(230, 235, 245);
                docPDF.rect(20, y, 170, 7, 'F');
                docPDF.setFont("helvetica", "bold");
                docPDF.text("Cliente", 22, y + 5);

                y += 7;
                docPDF.setFont("helvetica", "normal");
                docPDF.text(`Nome: ${clientInfo.name || order.clientName || 'N/A'}`, 22, y + 5);
                docPDF.text(`Razão social: ${clientInfo.razaoSocial || '-'}`, 105, y + 5);
                docPDF.text(`E-mail: ${clientInfo.email || '-'}`, 22, y + 11);
                docPDF.text(`CPF / CNPJ: ${clientInfo.document || '-'}`, 105, y + 11);
                docPDF.text(`Endereço: ${clientInfo.address || '-'}`, 22, y + 17);

                y += 24;

                // Horário
                docPDF.setFillColor(230, 235, 245);
                docPDF.rect(20, y, 170, 7, 'F');
                docPDF.setFont("helvetica", "bold");
                docPDF.text("Horário", 22, y + 5);

                y += 7;
                docPDF.setFont("helvetica", "normal");
                docPDF.text(`Data e hora de início: ${order.timeStart || 'N/A'}`, 22, y + 5);
                docPDF.text(`Data e hora de fim: ${order.timeEnd || 'Pendente'}`, 105, y + 5);

                y += 15;

                // EQUIPAMENTO
                docPDF.setFillColor(230, 235, 245);
                docPDF.rect(20, y, 170, 7, 'F');
                docPDF.setFont("helvetica", "bold");
                docPDF.text("Equipamento", 22, y + 5);

                y += 7;
                docPDF.setFont("helvetica", "normal");
                docPDF.text(`Equipamento: ${order.equipment || 'N/A'}`, 22, y + 5);
                docPDF.text(`Marca: ${order.brand || '-'} | Modelo: ${order.model || '-'}`, 105, y + 5);
                y += 6;
                docPDF.text(`Matrícula / N° de Série: ${order.serialNumber || '-'}`, 22, y + 5);

                y += 15;

                // SERVIÇOS REALIZADOS
                docPDF.setFillColor(230, 235, 245);
                docPDF.rect(20, y, 170, 7, 'F');
                docPDF.setFont("helvetica", "bold");
                docPDF.text("Serviços realizados", 22, y + 5);

                y += 10;
                docPDF.setFont("helvetica", "normal");
                const descText = `Tipo: ${order.serviceNature || ''} - ${order.serviceArea || ''}\nDescrição: ${order.description || 'Sem descrição'}`;
                const splitDescription = docPDF.splitTextToSize(descText, 165);
                docPDF.text(splitDescription, 22, y);

                y += (splitDescription.length * 5) + 8;

                // VALOR TOTAL
                docPDF.setFillColor(230, 235, 245);
                docPDF.rect(20, y, 170, 7, 'F');
                docPDF.setFont("helvetica", "bold");
                docPDF.text("VALOR TOTAL", 22, y + 5);

                y += 8;
                docPDF.setFont("helvetica", "normal");
                docPDF.text(`• Horas Trabalhadas: ${order.totalHours || '0'}h (R$ 200,00/h)`, 22, y + 4);
                docPDF.setFont("helvetica", "bold");
                docPDF.text(`• TOTAL: R$ ${order.totalValue || '0.00'}`, 22, y + 12);

                // CONDIÇÃO DE PAGAMENTO
                y += 18;
                docPDF.setFont("helvetica", "normal");
                docPDF.setFontSize(9);
                docPDF.text(`• Condição de Pagamento: Pagamento para ${order.paymentTerms || '30'} dias`, 22, y);

                y += 20;

                // Assinaturas
                docPDF.setLineWidth(0.2);
                docPDF.line(20, y + 15, 90, y + 15);
                docPDF.line(120, y + 15, 190, y + 15);

                docPDF.setFontSize(8);
                docPDF.text("NOME CLIENTE / RESPONSÁVEL", 35, y + 20);
                docPDF.text("ASSINATURA TÉCNICO RESPONSÁVEL", 128, y + 20);

                if (order.technicianSignature) {
                    docPDF.addImage(order.technicianSignature, 'PNG', 130, y - 5, 50, 18);
                }

                if (order.customerSignature) {
                    docPDF.addImage(order.customerSignature, 'PNG', 30, y - 5, 50, 18);
                }

                const pdfBlob = docPDF.output('blob');
                const fileName = `Relatorio_RG_${osId.substring(0, 6)}.pdf`;
                const pdfFile = new File([pdfBlob], fileName, { type: 'application/pdf' });

                if (navigator.canShare && navigator.canShare({ files: [pdfFile] })) {
                    try {
                        await navigator.share({
                            title: 'Relatório Técnico - RG Soluções',
                            text: `Segue o relatório técnico referente ao equipamento ${order.equipment}.`,
                            files: [pdfFile],
                        });
                        return;
                    } catch (error) {
                        if (error.name === 'AbortError') return;
                    }
                }

                const pdfUrl = URL.createObjectURL(pdfBlob);
                const downloadLink = document.createElement('a');
                downloadLink.href = pdfUrl;
                downloadLink.download = fileName;
                document.body.appendChild(downloadLink);
                downloadLink.click();
                document.body.removeChild(downloadLink);
                alert("Relatório PDF gerado com sucesso!");

            } catch (error) {
                console.error("Erro ao gerar o relatório PDF:", error);
                alert("Ocorreu um erro ao processar o relatório.");
            }
        };

        document.getElementById('apply-filters').addEventListener('click', () => {
            const selectedClient = document.getElementById('filter-client').value;
            const selectedType = document.getElementById('filter-type').value;
            const startDate = document.getElementById('filter-start').value;
            const endDate = document.getElementById('filter-end').value;

            const filtered = allOrders.filter(order => {
                if (selectedClient && order.clientId !== selectedClient) {
                    return false;
                }
                if (selectedType && order.serviceNature !== selectedType) {
                    return false;
                }
                if (order.timeStart) {
                    const orderDateStr = order.timeStart.split('T')[0];
                    if (startDate && orderDateStr < startDate) {
                        return false;
                    }
                    if (endDate && orderDateStr > endDate) {
                        return false;
                    }
                }
                return true;
            });

            renderHistory(filtered);
        });

        window.addEventListener('DOMContentLoaded', async () => {
            await loadClientsFilter();
            await loadHistory();
        });
    </script>
</body>
</html>
